# Cursor Configuration
cursor_shape block
cursor_blink_interval 1
cursor_trail 1
cursor_trail_start_threshold 0
cursor_trail_decay 0.15 0.4
cursor_trail_color #cceeff
open_url_with default
# 检测 URL 并允许点击打开
detect_urls yes
url_style curly
url_color #61afef
mouse_hide_wait 3.0

# background
background_opacity      0.80
# background_blur       10

# Window Configuration
# window_padding_width 1
hide_window_decorations yes
active_border_color #61afef
inactive_border_color #3e4452

# Scrollback
scrollback_lines 10000

# Font Configuration
font_family      family='Maple Mono NF CN' postscript_name=MapleMono-NF-CN-Regular
bold_font        family='Maple Mono NF CN' postscript_name=MapleMono-NF-CN-Bold
italic_font      family='Maple Mono NF CN' postscript_name=MapleMono-NF-CN-Italic
bold_italic_font family='Maple Mono NF CN' postscript_name=MapleMono-NF-CN-BoldItalic
font_size        14.0

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
enabled_layouts splits, stack
map ctrl+shift+\     launch --location=vsplit --cwd=current
map ctrl+shift+-     launch --location=hsplit --cwd=current
map ctrl+shift+t new_tab
map ctrl+= change_font_size all +1.0
map ctrl+- change_font_size all -1.0
map ctrl+0 change_font_size all 0
# 窗口切换
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down
# 按编号切换标签页
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5

# Shell integration
shell_integration enabled

# Dank color generation
include dank-tabs.conf
include dank-theme.conf
