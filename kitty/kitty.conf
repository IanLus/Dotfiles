# Cursor Configuration
cursor_shape block
cursor_blink_interval 1
cursor_trail 3
cursor_trail_start_threshold 0
# 光标拖尾 [最快， 最慢]
cursor_trail_decay 0.1 0.4
cursor_trail_color #00d7ff
custom_shaders cursor-trail-glow

open_url_with default
# 检测 URL 并允许点击打开
detect_urls yes
url_style curly
url_color #61afef
mouse_hide_wait 3.0

# background
background_opacity      0.80
# background_blur       10

# Window Configuration
window_padding_width 5
hide_window_decorations yes
active_border_color #61afef
inactive_border_color #3e4452

# Scrollback
scrollback_lines 10000
map ctrl+shift+k    scroll_line_up
map ctrl+shift+j    scroll_line_down
map ctrl+shift+.    scroll_page_up
map ctrl+shift+,    scroll_page_down
map ctrl+shift+l  scroll_home
map ctrl+shift+h  scroll_end

# Font Configuration
font_family      family='Maple Mono NF CN' postscript_name=MapleMono-NF-CN-Regular
bold_font        family='Maple Mono NF CN' postscript_name=MapleMono-NF-CN-Bold
italic_font      family='Maple Mono NF CN' postscript_name=MapleMono-NF-CN-Italic
bold_italic_font family='Maple Mono NF CN' postscript_name=MapleMono-NF-CN-BoldItalic
font_size        14.0

# MapleMono 没有的字体设置回退字体
symbol_map U+00AD,U+01D5,U+01D7,U+01D9,U+01DB,U+01F8-U+01F9,U+02BB,U+02CA-U+02CB,U+02EA-U+02EB,U+1100-U+11FF Noto Sans Mono CJK SC
symbol_map U+1E3E-U+1E3F,U+2002-U+2003,U+2011-U+2012,U+2015,U+2025,U+2035,U+203B,U+2042,U+2047-U+2049,U+2051 Noto Sans Mono CJK SC
symbol_map U+20DD-U+20DE,U+2100,U+2105,U+210A,U+210F,U+2121,U+2126-U+2127,U+212B,U+2135,U+213B,U+21B8-U+21B9 Noto Sans Mono CJK SC
symbol_map U+21C5,U+21CB-U+21CC,U+21F5,U+2206-U+2207,U+2213,U+221D,U+221F-U+2220,U+2225-U+2226,U+222C-U+222E Noto Sans Mono CJK SC
