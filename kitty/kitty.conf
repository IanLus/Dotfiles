symbol_map U+20000-U+2FFFF Jigmo2
symbol_map U+30000-U+3FFFF Jigmo3

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
enabled_layouts splits, stack
map alt+shift+\     launch --location=vsplit --cwd=current
map alt+shift+-     launch --location=hsplit --cwd=current
map alt+shift+h     resize_window narrower
map alt+shift+l     resize_window wider
map alt+shift+j     resize_window shorter
map alt+shift+k     resize_window taller

map ctrl+shift+t new_tab
map ctrl+= change_font_size all +1.0
map ctrl+- change_font_size all -1.0
map ctrl+0 change_font_size all 0
# 窗口切换
map ctrl+alt+h neighboring_window left
map ctrl+alt+l neighboring_window right
map ctrl+alt+k neighboring_window up
map ctrl+alt+j neighboring_window down
# 按编号切换标签页
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5

# Shell integration
shell_integration enabled

# Dank color generation
include dank-tabs.conf
include dank-theme.conf
