symbol_map U+2460-U+24BD,U+24BF-U+24E6,U+24E8-U+24FF,U+25A2-U+25A9,U+25B1,U+25D0-U+25D3,U+25E2-U+25E5 Noto Sans Mono CJK SC
symbol_map U+2600-U+2603,U+2605-U+2606,U+2609,U+260E-U+260F,U+2616-U+2617,U+261C-U+261F,U+262F,U+2640-U+2642 Noto Sans Mono CJK SC
