<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- LANG=en_US 时，Noto CJK 集合字体会被选成韩文。中文界面强制用简体。 -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>
  <!-- 这两个是竖排/旋转，不能拿来显示正文。 -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>Noto Fangsong KSS Rotated</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Noto Fangsong KSS Vertical</string>
        </patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
